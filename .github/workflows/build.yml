name: build

on:
  push:
    branches: [main]
  # Build the image on every pull request too. Without this a change to the
  # Dockerfile arrived with no signal at all -- its checks read "no checks",
  # which is not the same thing as green.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly: pick up the newest go-tex/engine release

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Nothing is published from a pull request, so there is no reason to hold
      # a registry credential during one -- and a fork's pull request is not
      # granted `packages: write` in any case.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds both platforms and stops there: the build is the
      # verdict, pushing is not. push, workflow_dispatch and the weekly
      # schedule all still publish exactly as before.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/loong64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/openweft/weft-loom-gotex:latest
